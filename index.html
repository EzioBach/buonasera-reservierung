.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(8,8,8,.84),rgba(8,8,8,.9))}
header{background:#fff;color:var(--black);text-align:center;padding:34px 20px 40px;position:relative;border-bottom:3px solid var(--gold)}
.logo{height:190px;max-width:80%;object-fit:contain;margin:0 auto 12px;display:block}
header h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:2rem;letter-spacing:.14em;text-transform:uppercase}
header p{color:#8a7d66;letter-spacing:.18em;font-size:.76rem;text-transform:uppercase;margin-top:4px}
.xnav{display:flex;justify-content:center;margin-top:16px}
.xnav a,.xbtn{display:inline-block;border:1px solid var(--gold);color:#141414;padding:9px 22px;text-decoration:none;font:500 .78rem 'Raleway',sans-serif;letter-spacing:.18em;text-transform:uppercase;transition:.2s}
.xnav a:hover,.xbtn:hover{background:var(--gold)}
.xfoot{text-align:center;margin:26px 0 0}
.xfoot .xbtn{color:var(--txt)}
.xfoot .xbtn:hover{color:#141414}
.lang{position:absolute;top:16px;right:16px;display:flex;gap:6px}
.lang button{background:none;border:1px solid var(--gold);color:var(--black);font:500 .72rem 'Raleway';padding:5px 10px;cursor:pointer;letter-spacing:.1em}

.band-in{width:100%;max-width:430px}
.notice{background:rgba(8,8,8,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(190,159,108,.55);padding:24px 26px;text-align:center}
.notice strong{font-family:'Cormorant Garamond',serif;font-size:1.5rem;letter-spacing:.08em;color:var(--gold);display:block;margin-bottom:4px}
.notice .hours{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 26px;font-weight:500;font-size:1.15rem;margin-bottom:8px}
.notice .brk{color:#ff6a73;font-weight:600;font-size:.9rem}
main{max-width:860px;margin:0 auto 60px;padding:44px 18px 40px}
.card{background:rgba(12,12,12,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);padding:30px 28px;margin-bottom:24px;box-shadow:0 10px 34px rgba(0,0,0,.45)}
.step{font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:600;letter-spacing:.04em;margin-bottom:16px;display:flex;align-items:center;gap:12px;color:#f6efe0}
.step i{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--red);color:#fff;font:600 .85rem 'Raleway';display:flex;align-items:center;justify-content:center}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cal-head b{font-family:'Cormorant Garamond',serif;font-size:1.35rem;letter-spacing:.05em;color:#f6efe0}
.nav{background:none;border:1px solid var(--line);color:var(--txt);width:36px;height:36px;cursor:pointer;font-size:1.1rem}
.nav:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}.nav:disabled{opacity:.3;cursor:default}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow{text-align:center;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);padding:4px 0}
.day{aspect-ratio:1/.8;border:1px solid rgba(190,159,108,.22);background:rgba(255,255,255,.04);cursor:pointer;font:500 .95rem 'Raleway';color:var(--txt);transition:.15s}
.day:hover:not(:disabled){background:rgba(190,159,108,.18);border-color:var(--gold)}
.day.sel{background:var(--red);border-color:var(--red);color:#fff}
.day.today{box-shadow:inset 0 0 0 1px var(--gold)}
.day:disabled{background:rgba(255,255,255,.02);color:#5c564a;border-color:rgba(255,255,255,.05);cursor:not-allowed;text-decoration:line-through}
.empty{visibility:hidden}
.slots-title{font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600;margin:6px 0 10px}
.slots{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.slot{padding:11px 22px;border:1px solid rgba(190,159,108,.28);background:rgba(255,255,255,.04);color:var(--txt);font:500 .95rem 'Raleway';cursor:pointer;transition:.15s;min-width:84px}
.slot:hover:not(:disabled){background:rgba(190,159,108,.18);border-color:var(--gold)}
.slot.sel{background:var(--gold);border-color:var(--gold);color:#141414}
.slot:disabled{background:rgba(255,255,255,.02);color:#5c564a;border-color:rgba(255,255,255,.05);cursor:not-allowed;text-decoration:line-through}
.pause{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--mute);font-size:.82rem;letter-spacing:.08em;text-transform:uppercase}
.pause::before,.pause::after{content:"";flex:1;height:1px;background:var(--line)}
.hint{font-size:.85rem;color:var(--mute)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line)}
.stepper button{width:48px;height:48px;border:none;background:rgba(255,255,255,.04);font-size:1.4rem;cursor:pointer;color:#ff6a73}
.stepper button:hover{background:rgba(190,159,108,.18)}
.stepper output{min-width:70px;text-align:center;font:600 1.15rem 'Raleway'}
label{display:block;font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;font-weight:600;margin:0 0 6px}
label em{color:#ff6a73;font-style:normal}label small{text-transform:none;letter-spacing:0;font-weight:400;color:var(--mute)}
input[type=text],input[type=tel],textarea{width:100%;padding:13px 14px;border:1px solid var(--line);background:rgba(255,255,255,.06);font:400 1rem 'Raleway';color:#f6efe0}
input::placeholder,textarea::placeholder{color:#7d7463}
input:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(190,159,108,.2)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
textarea{min-height:100px;resize:vertical}

.cbody{padding:30px 28px}
.summary{background:rgba(12,12,12,.78);border:1px solid var(--line);border-left:3px solid var(--red);padding:14px 18px;margin-bottom:20px;font-size:.95rem}
.summary.empty-s{color:var(--mute)}
.submit{width:100%;padding:17px;border:none;background:var(--red);color:#fff;font:600 .9rem 'Raleway';letter-spacing:.25em;text-transform:uppercase;cursor:pointer;transition:.2s}
.submit:hover:not(:disabled){background:#b50818}.submit:disabled{opacity:.6;cursor:wait}
.privacy{font-size:.76rem;color:var(--mute);text-align:center;margin-top:12px}
.err{color:#ff6a73;font-size:.88rem;margin-top:8px;min-height:1.2em;text-align:center}
.ok{display:none;text-align:center;padding:50px 24px;background:rgba(12,12,12,.88);border:1px solid var(--gold)}
.ok h2{font-family:'Cormorant Garamond',serif;font-size:2rem;margin-bottom:10px}
.ok .tick{width:56px;height:56px;border-radius:50%;border:2px solid var(--gold);color:var(--gold);font-size:1.8rem;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.ok button.plain{margin-top:22px;background:none;color:var(--txt);border:1px solid var(--gold);padding:11px 26px;cursor:pointer;font:500 .8rem 'Raleway';letter-spacing:.18em;text-transform:uppercase}
.btnl{display:inline-block;background:var(--red);color:#fff;border:1px solid var(--red);padding:11px 24px;text-decoration:none;font:500 .8rem 'Raleway';letter-spacing:.16em;text-transform:uppercase;cursor:pointer}
.btnl.alt{background:transparent;color:var(--txt);border-color:var(--gold)}
footer{background:#000;color:#bdb4a2;text-align:center;padding:30px 18px;font-size:.85rem;letter-spacing:.06em;border-top:1px solid var(--line)}
footer b{color:var(--gold);font-family:'Cormorant Garamond',serif;font-size:1.3rem;letter-spacing:.12em;display:block;margin-bottom:6px}
footer a{color:var(--gold);text-decoration:none}
.hp{position:absolute;left:-9999px}
@media(max-width:700px){.row{grid-template-columns:1fr}.card{padding:22px 16px}header h1{font-size:1.4rem}.logo{height:140px}.lang{position:static;justify-content:center;margin-bottom:14px}
 .band{justify-content:center;min-height:260px;padding:30px 16px;background-position:20% center}.band-in{max-width:100%}.withimg{grid-template-columns:1fr}.hand{display:none}.cbody{padding:22px 16px}}
</style>
</head>

  const ref=new Date(2024,0,1);
  $("dows").innerHTML=[0,1,2,3,4,5,6].map(i=>{const d=new Date(ref);d.setDate(1+i);return `<div class="dow">${d.toLocaleDateString(T[lang].locale,{weekday:"short"})}</div>`}).join("");
  renderCal();renderSlots();renderSummary();
}
function renderCal(){
  $("mlabel").textContent=view.toLocaleDateString(T[lang].locale,{month:"long",year:"numeric"});
  $("prev").disabled=view<=new Date(today.getFullYear(),today.getMonth(),1);
  $("next").disabled=new Date(view.getFullYear(),view.getMonth()+1,1)>maxDate;
  const first=new Date(view.getFullYear(),view.getMonth(),1);
  const offset=(first.getDay()+6)%7;
  const dim=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();
  let h="";
  for(let i=0;i<offset;i++)h+=`<div class="empty"></div>`;
  for(let d=1;d<=dim;d++){
    const dt=new Date(view.getFullYear(),view.getMonth(),d);
    const off=dt<today||dt>maxDate||CLOSED_WEEKDAYS.includes(dt.getDay());
    const cls=["day"];if(sel.date===iso(dt))cls.push("sel");if(+dt===+today)cls.push("today");
    h+=`<button type="button" class="${cls.join(" ")}" data-d="${iso(dt)}" ${off?"disabled":""}>${d}</button>`;
  }
  $("days").innerHTML=h;
}
function slotOff(t){
  if(!sel.date)return true;
  if(sel.date!==iso(new Date())) return false;
  const [hh,mm]=t.split(":").map(Number);const now=new Date();
  return hh*60+mm < now.getHours()*60+now.getMinutes()+MIN_LEAD_MINUTES;
}
function renderSlots(){
  const mk=t=>`<button type="button" class="slot ${sel.time===t?"sel":""}" data-time="${t}" ${slotOff(t)?"disabled":""}>${t}</button>`;
  $("lunchSlots").innerHTML=LUNCH.map(mk).join("");
  $("dinnerSlots").innerHTML=DINNER.map(mk).join("");
  $("slotHint").style.display=sel.date?"none":"block";
}
function renderSummary(){
  const s=$("summary");
  if(!sel.date&&!sel.time){s.className="summary empty-s";s.textContent=T[lang].sumEmpty;return;}
  s.className="summary";
  const parts=[];
  if(sel.date)parts.push(fmt(new Date(sel.date+"T12:00")));
  if(sel.time)parts.push(`${T[lang].at} ${sel.time}${T[lang].oclock?" "+T[lang].oclock:""}`);
  parts.push(gtxt(guests));
  s.textContent=parts.join(" · ");
}
document.querySelector(".lang").addEventListener("click",e=>{if(e.target.dataset.l){lang=e.target.dataset.l;applyLang();}});
$("prev").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);renderCal();};
$("next").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);renderCal();};
$("days").addEventListener("click",e=>{const b=e.target.closest(".day");if(!b||b.disabled)return;sel.date=b.dataset.d;if(sel.time&&slotOff(sel.time))sel.time=null;renderCal();renderSlots();renderSummary();});
function slotClick(e){const b=e.target.closest(".slot");if(!b||b.disabled)return;sel.time=b.dataset.time;renderSlots();renderSummary();}
$("lunchSlots").addEventListener("click",slotClick);$("dinnerSlots").addEventListener("click",slotClick);
$("minus").onclick=()=>{guests=Math.max(1,guests-1);$("gcount").textContent=guests;renderSummary();};
$("plus").onclick=()=>{guests=Math.min(MAX_ONLINE_GUESTS,guests+1);$("gcount").textContent=guests;renderSummary();};

$("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const L=T[lang],err=$("err");err.textContent="";
  const name=$("name").value.trim(),phone=$("phone").value.trim();
  if(!sel.date)return err.textContent=L.eDate;
  if(!sel.time)return err.textContent=L.eTime;
  if(name.length<2){$("name").focus();return err.textContent=L.eName;}
  if(!/^[+()\d\s\/.-]{6,}$/.test(phone)||phone.replace(/\D/g,"").length<6){$("phone").focus();return err.textContent=L.ePhone;}
  if($("hp").value)return;
  const dDE=new Date(sel.date+"T12:00").toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  const notes=$("notes").value.trim()||"–";
  const subject=`Neue Reservierung: ${dDE}, ${sel.time} Uhr – ${guests} Pers. – ${name}`;
  const showMail=()=>{
    const body=["Neue Tischreservierung","","Name: "+name,"Telefon: "+phone,"Datum: "+dDE,"Uhrzeit: "+sel.time+" Uhr","Personen: "+guests,"Anmerkungen: "+notes,"","— gesendet über die Reservierungsseite"].join("\r\n");
    const href="mailto:"+EMAIL+"?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(body);
    $("mReopen").href=href;
    $("mSummary").textContent=`${fmt(new Date(sel.date+"T12:00"))} · ${sel.time} · ${gtxt(guests)}`;
    $("mCopy").textContent=L.mCopy;
    $("mCopy").onclick=async()=>{try{await navigator.clipboard.writeText(body);}catch(_){}$("mCopy").textContent=T[lang].mCopied;};
    $("formWrap").style.display="none";$("mailOk").style.display="block";window.scrollTo({top:0,behavior:"smooth"});
    return href;
  };
  if(MODE==="mailto"){window.location.href=showMail();return;}
  const payload={_subject:subject,_template:"table",_captcha:"false","Name":name,"Telefon":phone,"Datum":dDE,"Uhrzeit":sel.time+" Uhr","Personen":String(guests),"Anmerkungen":notes};
  const btn=$("send");btn.disabled=true;btn.textContent=L.sending;
  try{
    const r=await fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify(payload)});
    const j=await r.json();
    if(!r.ok||j.success===false||j.success==="false")throw new Error();
    $("okText").textContent=L.okText(name,fmt(new Date(sel.date+"T12:00")),sel.time,gtxt(guests));
    $("formWrap").style.display="none";$("ok").style.display="block";window.scrollTo({top:0,behavior:"smooth"});
  }catch(x){showMail();}
  btn.disabled=false;btn.textContent=L.submit;
});
function reset(){sel={date:null,time:null};guests=2;$("gcount").textContent=2;$("f").reset();$("ok").style.display="none";$("mailOk").style.display="none";$("formWrap").style.display="block";applyLang();}
$("again").onclick=reset;$("again2").onclick=reset;
applyLang();
</script>
</body>
</html>
